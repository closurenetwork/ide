# Publish @closurenetwork/ide to npmjs.org when a version tag is pushed.
#
# Repo secret: NPM_TOKEN — granular token with Publish on closurenetwork org
# (Automation or Publish-only; do not use your personal login password).
#
# Release flow:
#   1. Bump version in package.json (and lockfile if needed)
#   2. Commit on main
#   3. git tag v0.2.2 && git push origin v0.2.2
#   Tag must match package.json "version" (with or without leading v).
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish --dry-run only"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@closurenetwork"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Missing repo secret NPM_TOKEN"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
